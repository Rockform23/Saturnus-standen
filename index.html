<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VV Saturnus Uden - Kantine Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            saturnus: {
              navy: '#0f172a',
              blue: '#1e3a8a',
              gold: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-saturnus-navy text-white min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 via-saturnus-blue to-blue-950 p-6 border-b-4 border-saturnus-gold shadow-2xl flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <div class="w-14 h-14 bg-saturnus-gold text-saturnus-navy rounded-full flex items-center justify-center font-extrabold text-2xl shadow-lg border-2 border-white">
        S
      </div>
      <div>
        <h1 class="text-3xl font-black tracking-wider text-white uppercase">VV Saturnus Uden</h1>
        <p class="text-saturnus-gold font-semibold text-sm tracking-wide">Kantine Live Standen</p>
      </div>
    </div>
    <div class="text-right">
      <div id="clock" class="text-4xl font-mono font-bold text-saturnus-gold">--:--:--</div>
      <div class="text-xs text-green-400 font-bold uppercase tracking-widest mt-1">● Online via GitHub</div>
    </div>
  </header>

  <!-- Content & Switcher -->
  <main class="flex-1 p-8 flex flex-col items-center space-y-4">
    
    <!-- Knoppen voor Uitslagen / Programma -->
    <div class="flex space-x-4">
      <button onclick="switchWidget('uitslagen')" id="btn-uitslagen" class="px-6 py-2 rounded-xl font-bold text-sm bg-saturnus-gold text-saturnus-navy shadow-lg transition-all">
        🏆 Laatste Uitslagen
      </button>
      <button onclick="switchWidget('programma')" id="btn-programma" class="px-6 py-2 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all">
        📅 Komend Programma
      </button>
    </div>

    <div class="w-full max-w-6xl bg-white text-slate-900 rounded-2xl border border-slate-700 p-6 shadow-2xl">
      <div id="widget-container" class="min-h-[450px]">
        <!-- Nevobo Widget wordt hier geladen -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 px-8 py-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
    <div>VV Saturnus Uden • <strong class="text-saturnus-gold">vvsaturnus.nl</strong></div>
    <div>Pagina ververst automatisch elke 2 minuten</div>
  </footer>

  <script>
    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('nl-NL');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function switchWidget(type) {
      const container = document.getElementById('widget-container');
      const btnUitslagen = document.getElementById('btn-uitslagen');
      const btnProgramma = document.getElementById('btn-programma');

      if (type === 'uitslagen') {
        btnUitslagen.className = "px-6 py-2 rounded-xl font-bold text-sm bg-saturnus-gold text-saturnus-navy shadow-lg";
        btnProgramma.className = "px-6 py-2 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700";
      } else {
        btnProgramma.className = "px-6 py-2 rounded-xl font-bold text-sm bg-saturnus-gold text-saturnus-navy shadow-lg";
        btnUitslagen.className = "px-6 py-2 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700";
      }

      container.innerHTML = '';
      const script = document.createElement('script');
      script.src = `https://www.volleybal.nl/widget/${type}/CKM0Y96`;
      script.async = true;
      container.appendChild(script);
    }

    // Standaard openen met Uitslagen
    switchWidget('uitslagen');

    // Automatisch herladen na 2 minuten
    setTimeout(() => {
      window.location.reload();
    }, 120000);
  </script>
</body>
</html>
