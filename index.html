<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VV Saturnus Uden - Kantine Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            saturnus: {
              navy: '#0f172a',
              blue: '#1e3a8a',
              gold: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-saturnus-navy text-white min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 via-saturnus-blue to-blue-950 p-6 border-b-4 border-saturnus-gold shadow-2xl flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <div class="w-14 h-14 bg-saturnus-gold text-saturnus-navy rounded-full flex items-center justify-center font-extrabold text-2xl shadow-lg border-2 border-white">
        S
      </div>
      <div>
        <h1 class="text-3xl font-black tracking-wider text-white uppercase">VV Saturnus Uden</h1>
        <p class="text-saturnus-gold font-semibold text-sm tracking-wide">Kantine Live Standen</p>
      </div>
    </div>
    <div class="text-right">
      <div id="clock" class="text-4xl font-mono font-bold text-saturnus-gold">--:--:--</div>
      <div class="text-xs text-green-400 font-bold uppercase tracking-widest mt-1">● Online via GitHub</div>
    </div>
  </header>

  <!-- Content (Nevobo Widget) -->
  <main class="flex-1 p-8 flex flex-col justify-center items-center">
    <div class="w-full max-w-6xl bg-white text-slate-900 rounded-2xl border border-slate-700 p-6 shadow-2xl">
      <h2 class="text-xl font-bold text-saturnus-navy mb-4 border-b pb-2 uppercase tracking-wider">
        🏐 Programma & Live Standen
      </h2>
      <!-- Officiële Nevobo Widget voor VV Saturnus (CKM0Y96) -->
      <div class="min-h-[450px]">
        <script src="https://www.volleybal.nl/widget/programma/CKM0Y96"></script>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 px-8 py-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
    <div>VV Saturnus Uden • <strong class="text-saturnus-gold">vvsaturnus.nl</strong></div>
    <div>Pagina ververst automatisch elke 2 minuten</div>
  </footer>

  <script>
    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('nl-NL');
    }
    setInterval(updateClock, 1000);
    updateClock();

    setTimeout(() => {
      window.location.reload();
    }, 120000);
  </script>
</body>
</html>
